services:
  postgres:
    image: postgres:16-alpine
    container_name: vulntriage-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: vulntriage
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../orchestrator/migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  orchestrator:
    build:
      context: ..
      dockerfile: orchestrator/Dockerfile
    container_name: vulntriage-orchestrator
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/vulntriage
      SOURCE_ROOT: /src
      CONTEXT_LINES: ${CONTEXT_LINES:-20}
      LLM_SERVICE_URL: http://llm-service:8000
      LLM_CLIENT_TIMEOUT_SECONDS: ${LLM_CLIENT_TIMEOUT_SECONDS:-30}
      ANALYSIS_CONCURRENCY: ${ANALYSIS_CONCURRENCY:-4}
      ANALYSIS_MIN_SEVERITY: ${ANALYSIS_MIN_SEVERITY:-medium}
      ANALYSIS_MAX_FINDINGS: ${ANALYSIS_MAX_FINDINGS:-100}
      ANALYSIS_TIMEOUT_SECONDS: ${ANALYSIS_TIMEOUT_SECONDS:-300}
    ports:
      - "8080:8080"
    volumes:
      - ${SOURCE_DIR:-../testdata/sample-repo}:/src:ro
    depends_on:
      postgres:
        condition: service_healthy
      llm-service:
        condition: service_healthy
    restart: unless-stopped

  llm-service:
    build:
      context: ..
      dockerfile: llm-service/Dockerfile
    container_name: vulntriage-llm-service
    environment:
      LLM_PROVIDER: ${LLM_PROVIDER:-mock}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_TIMEOUT_SECONDS: 30
      LLM_MAX_RETRIES: 1
      MAX_CONTEXT_CHARS: 8000
    ports:
      - "8000:8000"
    healthcheck:
      # stdlib only: `requests` is not installed in the llm-service image
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: unless-stopped

volumes:
  postgres_data:
